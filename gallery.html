  <style>
    :root {
      --cream: #F7F2EB;
      --cream-dark: #EDE5D8;
      --rust: #B5432A;
      --brown: #3A2315;
      --brown-mid: #6B3F25;
      --gold: #C9933A;
      --gold-light: #E8B862;
      --text-muted: #7A5C45;
      --border: #DDD3C4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--cream); color: var(--brown); font-family: 'Karla', sans-serif; overflow-x: hidden; }

    /* NAV */
    .site-nav {
      background: var(--brown);
      border-bottom: 2px solid var(--rust);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 56px;
    }
    .nav-logo {
      font-family: 'Playfair Display', serif; font-size: 1.25rem;
      color: #F7F2EB; font-style: italic; text-decoration: none;
    }
    .nav-logo span { color: var(--gold-light); }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: #EDE5D8; text-decoration: none; transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--gold-light); }

    /* PAGE HEADER */
    .page-header {
      text-align: center; padding: 64px 24px 48px;
      border-bottom: 1px solid var(--border);
    }
    .page-label {
      font-size: 0.72rem; letter-spacing: 0.4em; text-transform: uppercase;
      color: var(--rust); margin-bottom: 12px;
    }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem); color: var(--brown); margin-bottom: 12px;
    }
    .page-count {
      font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.1em;
    }

    /* GALLERY GRID */
    .gallery-wrap {
      max-width: 1400px; margin: 0 auto; padding: 48px 20px 80px;
    }
    .masonry {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .masonry-item {
      aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      background: var(--cream-dark);
    }
    .masonry-item img {
      width: 100%; height: 100%; display: block;
      object-fit: cover; object-position: center;
      transition: transform 0.35s ease, filter 0.35s ease;
    }
    .masonry-item:hover img {
      transform: scale(1.04);
      filter: brightness(0.88);
    }
    .masonry-item .hover-icon {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.25s;
      pointer-events: none;
    }
    .masonry-item:hover .hover-icon { opacity: 1; }
    .hover-icon span {
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: white; border: 1px solid rgba(255,255,255,0.6);
      padding: 7px 16px; border-radius: 2px;
      background: rgba(0,0,0,0.3); backdrop-filter: blur(2px);
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed; inset: 0; z-index: 999;
      display: none; align-items: center; justify-content: center;
      background: rgba(15,7,3,0.95); padding: 16px;
      backdrop-filter: blur(6px);
    }
    .lightbox.open { display: flex; }
    .lb-inner {
      position: relative; max-width: 1100px; width: 100%;
      display: flex; flex-direction: column; align-items: center;
    }
    .lb-img-wrap {
      max-height: 88vh; overflow: hidden; display: flex;
      align-items: center; justify-content: center;
    }
    .lb-img-wrap img {
      max-height: 88vh; max-width: 100%; object-fit: contain;
      border: 2px solid rgba(201,147,58,0.3); border-radius: 2px;
    }
    .lb-close {
      position: absolute; top: -14px; right: -14px;
      width: 36px; height: 36px; background: var(--rust); color: white;
      border: none; border-radius: 50%; font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .lb-close:hover { background: #D4553A; }
    .lb-nav {
      position: absolute; top: 50%; width: calc(100% + 80px);
      left: -40px; transform: translateY(-50%);
      display: flex; justify-content: space-between; pointer-events: none;
    }
    .lb-nav button {
      width: 40px; height: 40px; background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2); color: white;
      border-radius: 50%; cursor: pointer; font-size: 1rem;
      pointer-events: all; transition: background 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .lb-nav button:hover { background: rgba(201,147,58,0.3); border-color: var(--gold-light); }
    .lb-counter {
      margin-top: 12px; font-size: 0.72rem; letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
    }

    /* FOOTER */
    .site-footer {
      background: #1E0F07; color: #7A5C45;
      text-align: center; padding: 28px 24px;
    }
    .footer-logo {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 1.2rem; color: #EDE5D8; margin-bottom: 8px;
    }
    .footer-text { font-size: 0.75rem; }
    .footer-links { margin-top: 12px; font-size: 0.72rem; letter-spacing: 0.08em; }
    .footer-links a { color: #5A4030; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #7A5C45; }

    @media (max-width: 600px) {

      .masonry { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>

function getThumb(p) {
  return p.url.replace('2500w', '500w'); // small thumbnail for grid
}
function getFullSrc(p) {
  return p.url; // CDN URL — always available
}

const grid = document.getElementById('masonryGrid');
let currentIdx = 0;

// IntersectionObserver for true lazy loading
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const img = entry.target.querySelector('img[data-src]');
      if (img) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
      observer.unobserve(entry.target);
    }
  });
}, { rootMargin: '200px' });

photos.forEach((p, i) => {
  const div = document.createElement('div');
  div.className = 'masonry-item';
  const img = document.createElement('img');
  if (i < 12) {
    img.src = getThumb(p); // load first 12 immediately
  } else {
    img.dataset.src = getThumb(p);
    img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  }
  img.alt = `Photo ${i+1}`;
  div.appendChild(img);
  div.insertAdjacentHTML('beforeend', `<div class="hover-icon"><span>View</span></div>`);
  div.addEventListener('click', () => openLb(i));
  grid.appendChild(div);
  if (i >= 12) observer.observe(div);
});

// Lightbox
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCounter = document.getElementById('lbCounter');

function openLb(idx) {
  currentIdx = idx;
  updateLb();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function updateLb() {
  lbImg.src = getFullSrc(photos[currentIdx]);
  lbCounter.textContent = (currentIdx + 1) + ' / ' + photos.length;
}

document.getElementById('lbClose').addEventListener('click', closeLb);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.getElementById('lbPrev').addEventListener('click', () => { currentIdx = (currentIdx - 1 + photos.length) % photos.length; updateLb(); });
document.getElementById('lbNext').addEventListener('click', () => { currentIdx = (currentIdx + 1) % photos.length; updateLb(); });

// Swipe navigation
let swipeStartX = 0, swipeStartY = 0;
lb.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { swipeStartX = e.touches[0].clientX; swipeStartY = e.touches[0].clientY; }
}, { passive: true });
lb.addEventListener('touchend', e => {
  if (e.changedTouches.length !== 1) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if (Math.abs(dx) > 52 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    currentIdx = dx < 0 ? (currentIdx + 1) % photos.length : (currentIdx - 1 + photos.length) % photos.length;
    updateLb();
  }
}, { passive: true });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') { currentIdx = (currentIdx - 1 + photos.length) % photos.length; updateLb(); }
  if (e.key === 'ArrowRight') { currentIdx = (currentIdx + 1) % photos.length; updateLb(); }
});

function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
}
</script>
